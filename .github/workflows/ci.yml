# CI 门禁（任务卡 P1-01 交付物；命令清单见 docs/ENGINEERING.md §3）。
#
# params:verify 已于 P1-03 交付转正：附录 A.5 等式不成立时 CI 必须红。
# migrate:check 在 P1-04 交付前仍是"未实现"占位（非零退出），保留 continue-on-error，交付后移除。
# build 不在任务卡列出的五个 CI 项中，但属于 A-P1-REPO 验收项，一并执行。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 安装依赖（锁文件冻结）
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: params:verify（附录 A.5 启动等式）
        run: pnpm params:verify
      - name: migrate:check（预期失败至 P1-04 交付）
        run: pnpm migrate:check
        continue-on-error: true
      - name: build
        run: pnpm build
