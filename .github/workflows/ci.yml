# CI 门禁（任务卡 P1-01 交付物；命令清单见 docs/ENGINEERING.md §3）。
#
# params:verify（P1-03，#5）与 migrate:check（P1-04，#6）均已转正：
# 等式不成立 / 迁移不可重放时 CI 必须红。
# build 不在任务卡列出的五个 CI 项中，但属于 A-P1-REPO 验收项，一并执行。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 安装依赖（锁文件冻结）
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: params:verify（附录 A.5 启动等式）
        run: pnpm params:verify
      - name: migrate:check（空库重放与索引检查）
        run: pnpm migrate:check
      - name: build
        run: pnpm build
